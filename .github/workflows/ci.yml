name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  NODE_ENV: test
  DISTIL_TEST_MODE: "1"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  deterministic-tests:
    name: Unit, component, and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:component
      - run: npm run test:contract
      - run: npm run test:sqlite-compat
      - run: npm run test:phase3-isolation

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DISTIL_TEST_POSTGRES_URL: postgresql://distil:distil_test_password@127.0.0.1:5432/distil_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: distil_test
          POSTGRES_USER: distil
          POSTGRES_PASSWORD: distil_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distil -d distil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  security:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:security

  browser-e2e:
    name: Web and mobile E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://distil:distil_test_password@127.0.0.1:5432/distil_test
      DISTIL_E2E_PRODUCTION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: distil_test
          POSTGRES_USER: distil
          POSTGRES_PASSWORD: distil_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distil -d distil_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3100
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  extension-e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:extension
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          # Push deltas depend on batching and make the same branch pass or fail
          # based on its previous push. Compare branches to the stable main base.
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - static
      - deterministic-tests
      - postgres-integration
      - security
      - browser-e2e
      - extension-e2e
      - production-build
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success,success,success,success"
