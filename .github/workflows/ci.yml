name: Quick gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  NODE_ENV: test
  DISTIL_TEST_MODE: "1"

jobs:
  # Tier 1: lint + typecheck + every deterministic Jest suite in parallel.
  # The job id/name `quality-gate` is the required status check in branch
  # protection; keep it stable. Heavy jobs live in full-gate.yml.
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-file prettier check compares against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
