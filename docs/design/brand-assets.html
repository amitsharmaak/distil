<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Distil — approved production artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f3ed;
        color: #172329;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 40px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid #b6b8b5;
        padding-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 550;
      }
      header span,
      figcaption,
      .label {
        font-size: 12px;
        color: #626c70;
      }
      .hero {
        display: flex;
        justify-content: center;
        padding: 65px 20px;
      }
      .hero img {
        width: min(510px, 100%);
        height: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      .sample {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 170px;
        padding: 25px;
        border: 1px solid #d6d7d3;
        border-radius: 16px;
      }
      .sample img {
        width: 240px;
        max-width: 100%;
        height: auto;
      }
      .dark {
        background: #172329;
        border-color: #172329;
      }
      figcaption {
        margin-top: 8px;
      }
      .sizes {
        display: flex;
        align-items: end;
        gap: 35px;
        min-height: 116px;
        padding: 22px 0;
      }
      .sizes figure {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sizes img {
        display: block;
      }
      .rule {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #b6b8b5;
      }
      .phone {
        background: #dae1df;
        border-radius: 22px;
        padding: 17px;
      }
      .phone img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      footer {
        margin-top: 22px;
        font-size: 12px;
        color: #626c70;
      }
      @media (max-width: 600px) {
        main {
          padding: 24px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .sizes {
          gap: 20px;
          flex-wrap: wrap;
        }
        header {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>distil / approved production artwork</h1>
        <span>One identity · light, dark and small sizes</span>
      </header>
      <div class="hero">
        <img src="../../public/brand/distil-logo.svg" alt="Distil approved logo" />
      </div>
      <div class="grid">
        <figure>
          <div class="sample">
            <img src="../../public/brand/distil-logo-mono.svg" alt="Distil in one color" />
          </div>
          <figcaption>Monochrome</figcaption>
        </figure>
        <figure>
          <div class="sample dark">
            <img src="../../public/brand/distil-logo-light.svg" alt="Distil on a dark background" />
          </div>
          <figcaption>Dark surfaces</figcaption>
        </figure>
      </div>
      <section class="rule">
        <div class="label">Actual display sizes</div>
        <div class="sizes">
          <figure>
            <img
              src="../../browser-extension/icons/icon16.png"
              width="16"
              height="16"
              alt="16 pixel icon"
            />
            <figcaption>16 px</figcaption>
          </figure>
          <figure>
            <img src="../../public/logo.svg" width="24" height="24" alt="24 pixel icon" />
            <figcaption>24 px</figcaption>
          </figure>
          <figure>
            <img
              src="../../browser-extension/icons/icon32.png"
              width="32"
              height="32"
              alt="32 pixel icon"
            />
            <figcaption>32 px</figcaption>
          </figure>
          <figure>
            <img
              src="../../browser-extension/icons/icon48.png"
              width="48"
              height="48"
              alt="48 pixel icon"
            />
            <figcaption>48 px</figcaption>
          </figure>
          <figure>
            <div class="phone">
              <img
                src="../../public/icons/apple-touch-icon.png"
                width="64"
                height="64"
                alt="Phone home screen icon"
              />
            </div>
            <figcaption>Phone home screen</figcaption>
          </figure>
          <figure>
            <img
              src="../../public/brand/distil-logo.svg"
              width="83"
              height="28"
              alt="Sidebar logo at 28 pixels high"
            />
            <figcaption>Sidebar · 28 px high</figcaption>
          </figure>
        </div>
      </section>
      <footer>
        Clean vector geometry and outlined lettering. All icon exports use the same approved master.
      </footer>
    </main>
  </body>
</html>
